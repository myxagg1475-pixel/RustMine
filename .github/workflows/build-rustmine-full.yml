name: Build RustMine full Minecraft launcher

on:
  workflow_dispatch:
  push:
    branches: [integrate-amethyst-launcher]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout RustMine
        uses: actions/checkout@v4

      - name: Checkout Amethyst engine and native components
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          path: amethyst
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download required bundled Java 8 runtime
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: amethyst/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Prepare language resources
        working-directory: amethyst
        run: |
          bash scripts/languagelist_updater.sh
          mkdir -p out

      - name: Apply RustMine app branding
        working-directory: amethyst
        run: |
          sed -i 's/Amethyst (Debug)/RustMine/g; s/"Amethyst"/"RustMine"/g' app_pojavlauncher/build.gradle

      - name: Build full Android launcher
        working-directory: amethyst
        run: gradle :app_pojavlauncher:assembleDebug --stacktrace

      - name: Publish RustMine APK
        uses: actions/upload-artifact@v4
        with:
          name: RustMine-Full-APK
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          if-no-files-found: error
