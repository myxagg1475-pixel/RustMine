name: Build Rust Armor Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Generate Rust-style armor textures and icons
        run: python3 tools/generate_textures.py
      - name: Build mod
        run: gradle --no-daemon clean build
      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: Rust-Armor-Fabric-1.21.11
          path: build/libs/*[!sources].jar
          if-no-files-found: error
          retention-days: 14
